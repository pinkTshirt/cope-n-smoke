<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Virtual Cigarette</title>
  </head>

  <body>
    <main class="app">

      <header class="topbar">
        <div>
          <h1>Virtual Cigarette</h1>
          <div id="status">Camera inactive</div>
        </div>

        <div class="status-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </header>


      <section class="camera-shell">

        <video
          id="camera"
          autoplay
          muted
          playsinline
        ></video>

        <canvas id="overlay"></canvas>


        <div id="startCard">

          <div class="start-card-inner">

            <h2>Camera-controlled demo</h2>

            <p>
              Allow camera access, then move your hand
              into view. Bring the virtual cigarette
              toward your mouth to simulate a puff.
            </p>

            <button
              id="startButton"
              type="button"
            >
              Start camera
            </button>

          </div>

        </div>

      </section>


      <div class="controls">

        <button
          id="resetButton"
          type="button"
          disabled
        >
          Reset cigarette
        </button>

        <label class="debug-control">
          <input
            id="debugToggle"
            type="checkbox"
          />

          <span>Debug landmarks</span>
        </label>

      </div>


      <div class="puff-indicators">

        <span class="puff-dot" id="puff1"></span>
        <span class="puff-dot" id="puff2"></span>
        <span class="puff-dot" id="puff3"></span>

        <span id="puffCount">
          Puffs: 0/3
        </span>

      </div>


      <div class="footer-note">
        This is for fun. Smoking is not good for you.
      </div>

    </main>


    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
